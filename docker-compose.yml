services:

  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    image: hermes-litellm-proxy:latest

    container_name: litellm

    restart: unless-stopped

    ports:
      # En production : commenter la ligne suivante si seul Hermes doit joindre LiteLLM (réseau Docker interne).
      - "4000:4000"

    environment:
      # Injectées par Coolify, un .env local, ou export avant `docker compose up`
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # LiteLLM récent attend aussi ce nom pour nvidia_nim (health + appels)
      NVIDIA_NIM_API_KEY: ${NVIDIA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

    # /health/liveliness = process vivant (JSON "I'm alive!"). /health teste tous les modèles (lent, peut bloquer le déploiement).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5); json.loads(r.read().decode())\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    image: hermes-agent-local:latest

    container_name: hermes-agent

    restart: unless-stopped

    command:
      - gateway
      - run

    depends_on:
      litellm:
        condition: service_healthy

    ports:
      # Si tu changes HERMES_API_SERVER_PORT, adapte aussi le port à droite (conteneur).
      - "${HERMES_PUBLISH_PORT:-8642}:${HERMES_API_SERVER_PORT:-8642}"

    # Basic Auth devant Hermes (Coolify / Traefik). Sans HERMES_BASIC_AUTH_USERS, commente ce bloc ou définis la variable (voir README / .env.example).
    # https://coolify.io/docs/knowledge-base/proxy/traefik/basic-auth#docker-compose-and-services
    labels:
      - "traefik.http.middlewares.hermes-basicauth.basicauth.users=${HERMES_BASIC_AUTH_USERS}"
      - "coolify.traefik.middlewares=hermes-basicauth"

    environment:
      # Hermes → LiteLLM (surcharge .env / Coolify ; voir README « Deux fichiers YAML »)
      CUSTOM_BASE_URL: ${HERMES_LITELLM_BASE_URL:-http://litellm:4000/v1}
      OPENAI_API_KEY: ${HERMES_LITELLM_API_KEY:-dummy}
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:-custom}
      HERMES_INFERENCE_MODEL: ${HERMES_LITELLM_MODEL:-fast-model}

      # Serveur HTTP (UI + API). Défauts = doc officielle ; surcharge via .env / Coolify (préfixe HERMES_*).
      API_SERVER_ENABLED: "${HERMES_API_SERVER_ENABLED:-true}"
      API_SERVER_HOST: "${HERMES_API_SERVER_HOST:-0.0.0.0}"
      API_SERVER_PORT: "${HERMES_API_SERVER_PORT:-8642}"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      # Origines autorisées pour l’UI dans le navigateur (* = dev uniquement ; restreindre derrière Coolify en prod)
      API_SERVER_CORS_ORIGINS: ${HERMES_CORS_ORIGINS:-*}

    volumes:
      - hermes_data:/opt/data

    shm_size: "1gb"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import os,urllib.request as u;p=os.environ.get('API_SERVER_PORT','8642');r=u.Request('http://127.0.0.1:%s/health'%p);k=os.environ.get('API_SERVER_KEY') or '';k and r.add_header('Authorization', 'Bearer ' + k);u.urlopen(r,timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  hermes_data:
