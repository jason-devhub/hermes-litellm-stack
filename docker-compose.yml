services:

  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    image: hermes-litellm-proxy:latest

    container_name: litellm

    restart: unless-stopped

    expose:
      - "4000"

    environment:
      # Injectées par Coolify, un .env local, ou export avant `docker compose up`
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # LiteLLM récent attend aussi ce nom pour nvidia_nim (health + appels)
      NVIDIA_NIM_API_KEY: ${NVIDIA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

    # /health/liveliness = process vivant (JSON "I'm alive!"). /health teste tous les modèles (lent, peut bloquer le déploiement).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5); json.loads(r.read().decode())\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    image: hermes-agent-local:latest

    container_name: hermes-agent

    restart: unless-stopped

    command:
      - gateway
      - run

    depends_on:
      litellm:
        condition: service_healthy

    expose:
      - "${HERMES_API_SERVER_PORT:-8642}"
      - "${HERMES_DASHBOARD_PORT:-9119}"

    environment:
      # Hermes → LiteLLM (surcharge .env / Coolify ; voir README « Deux fichiers YAML »)
      CUSTOM_BASE_URL: ${HERMES_LITELLM_BASE_URL:-http://litellm:4000/v1}
      OPENAI_API_KEY: ${HERMES_LITELLM_API_KEY:-dummy}
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:-custom}
      HERMES_INFERENCE_MODEL: ${HERMES_LITELLM_MODEL:-fast-model}

      # Serveur HTTP (gateway + API). Défauts = doc officielle ; surcharge via .env / Coolify (préfixe HERMES_*).
      API_SERVER_ENABLED: "${HERMES_API_SERVER_ENABLED:-true}"
      API_SERVER_HOST: "${HERMES_API_SERVER_HOST:-0.0.0.0}"
      API_SERVER_PORT: "${HERMES_API_SERVER_PORT:-8642}"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      # Origines autorisées pour l’UI dans le navigateur (* = dev uniquement ; restreindre derrière Coolify en prod)
      API_SERVER_CORS_ORIGINS: ${HERMES_CORS_ORIGINS:-*}

      # Dashboard Hermes (sessions, skills, jobs) — requis par Hermes Workspace
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "${HERMES_DASHBOARD_HOST:-0.0.0.0}"
      HERMES_DASHBOARD_PORT: "${HERMES_DASHBOARD_PORT:-9119}"

    volumes:
      - hermes_data:/opt/data

    shm_size: "1gb"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import os,urllib.request as u;p=os.environ.get('API_SERVER_PORT','8642');r=u.Request('http://127.0.0.1:%s/health'%p);k=os.environ.get('API_SERVER_KEY') or '';k and r.add_header('Authorization', 'Bearer '+k);u.urlopen(r,timeout=5).read();d=os.environ.get('HERMES_DASHBOARD_PORT','9119');u.urlopen('http://127.0.0.1:%s/api/status'%d,timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  hermes-workspace:
    image: ${HERMES_WORKSPACE_IMAGE:-ghcr.io/outsourc-e/hermes-workspace:latest}

    container_name: hermes-workspace

    restart: unless-stopped

    depends_on:
      hermes:
        condition: service_healthy

    # Port interne pour Coolify/Traefik : rattache un domaine au service hermes-workspace, port 3000.
    expose:
      - "${HERMES_WORKSPACE_PORT:-3000}"

    environment:
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://hermes:${HERMES_API_SERVER_PORT:-8642}
      HERMES_DASHBOARD_URL: http://hermes:${HERMES_DASHBOARD_PORT:-9119}
      HERMES_API_TOKEN: ${HERMES_API_SERVER_KEY:-}
      HERMES_PASSWORD: ${HERMES_PASSWORD:-}
      COOKIE_SECURE: ${HERMES_WORKSPACE_COOKIE_SECURE:-1}
      TRUST_PROXY: ${HERMES_WORKSPACE_TRUST_PROXY:-1}

    volumes:
      - hermes_data:/home/workspace/.hermes
      - hermes_workspace_files:/workspace

volumes:
  hermes_data:
  hermes_workspace_files:
