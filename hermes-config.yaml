# Hermes uniquement : schéma différent de litellm-config.yaml (fusion impossible).
# URL / clé / modèle côté LiteLLM : .env → docker-compose (voir HERMES_LITELLM_*).
# « default » sert de repli ; en pratique HERMES_INFERENCE_MODEL (injecté par compose) prime.

model:
  provider: custom
  default: fast-model
  base_url: http://litellm:4000/v1
  # Minimum Hermes Agent : 64k (doc officielle). Llama 8B NIM supporte 128k.
  context_length: 131072

# Chat UI : moins d’outils = réponses plus rapides et sessions plus légères
agent:
  disabled_toolsets:
    - browser

# Timeouts allongés pour les appels via LiteLLM → NVIDIA NIM (cold start possible)
providers:
  custom:
    request_timeout_seconds: 600
    stale_timeout_seconds: 600
